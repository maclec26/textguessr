<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>textguessr - Errate den Song</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b100d;
            --panel-bg: #121814;
            --green: #1db954;
            --green-hover: #1ed760;
            --text-main: #ffffff;
            --text-muted: #b3b3b3;
            --border-color: #28362c;
            --error-red: #e22134;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--green); margin: 0 0 5px 0; display: flex; align-items: center; justify-content: center; gap: 10px; }
        header p { color: var(--text-muted); margin: 0; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }

        .container { display: flex; gap: 20px; max-width: 1200px; width: 100%; }

        .game-area {
            flex: 2;
            background: var(--panel-bg);
            border-radius: 12px;
            padding: 30px;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .stats-bar { display: flex; justify-content: space-between; color: var(--text-muted); margin-bottom: 20px; }
        .stats-bar span strong { color: var(--green); }

        .lyrics-display {
            background: #000;
            border-radius: 8px;
            padding: 40px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.5em;
            font-style: italic;
            border: 1px dashed var(--border-color);
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .unlock-controls { display: flex; justify-content: center; margin-bottom: 30px; }

        button {
            background: transparent;
            color: var(--text-main);
            border: 1px solid var(--green);
            padding: 10px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        button:hover { background: rgba(29, 185, 84, 0.1); }
        button.primary { background: var(--green); color: #000; }
        button.primary:hover { background: var(--green-hover); }
        button:disabled { border-color: var(--text-muted); color: var(--text-muted); cursor: not-allowed; background: transparent; }

        .input-area { display: flex; gap: 10px; position: relative; }
        .autocomplete-wrapper { position: relative; flex: 1; }

        input[type="text"] {
            width: 100%;
            box-sizing: border-box;
            background: #000;
            border: 1px solid var(--border-color);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 1em;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus { border-color: var(--green); }

        /* Volume Slider Styling */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: var(--green);
            cursor: pointer;
            margin-top: -6px;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #535353;
            border-radius: 2px;
        }
        input[type="range"]:focus { outline: none; }

        .autocomplete-items {
            position: absolute;
            border: 1px solid var(--border-color);
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--panel-bg);
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
        }

        .autocomplete-items div { padding: 10px; cursor: pointer; border-bottom: 1px solid var(--border-color); }
        .autocomplete-items div:hover { background-color: rgba(29, 185, 84, 0.2); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .input-error { border-color: var(--error-red) !important; animation: shake 0.4s ease-in-out; }

        .sidebar { flex: 1; display: flex; flex-direction: column; gap: 20px; }
        .panel { background: var(--panel-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border-color); }
        .panel h3 { margin-top: 0; font-size: 1em; color: var(--text-muted); text-transform: uppercase; display: flex; align-items: center; gap: 8px;}
        .playlist-input { margin-bottom: 10px; }

        #result-overlay {
            display: none;
            background: rgba(0,0,0,0.8);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            text-align: center;
            border: 1px solid var(--green);
        }

        #result-title { color: var(--green); font-size: 1.5em; margin-bottom: 10px; font-weight: bold; }
        #result-song-info { font-size: 1.2em; margin-bottom: 15px; }
        audio { width: 100%; height: 40px; outline: none; }

        #loading-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 16, 13, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .otter { font-size: 80px; animation: bounce 1s infinite alternate; margin-bottom: 20px; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-20px); } }
    </style>
</head>
<body>

    <div id="loading-overlay">
        <div class="otter">🦦🎧</div>
        <h2 style="color: var(--green);">Frage Daten vom Server ab...</h2>
    </div>

    <header>
        <h1>📄 textguessr</h1>
        <p>Errate den Song anhand der Lyrics</p>
    </header>

    <div class="container">
        <!-- Game Area -->
        <div class="game-area">
            <div class="stats-bar">
                <span>Runde: <strong id="round-display">1/10</strong></span>
                <span>Punkte: <strong id="score-display">0</strong></span>
            </div>

            <div class="lyrics-display" id="lyrics-text">"..."</div>

            <div class="unlock-controls">
                <button id="reveal-btn" onclick="revealNextStep()">Mehr Wörter anzeigen (3)</button>
            </div>

            <div class="input-area" id="guessing-controls">
                <div class="autocomplete-wrapper">
                    <input type="text" id="guess-input" placeholder="Künstler oder Songtitel suchen..." oninput="showSuggestions(this.value)" onkeydown="handleKeyPress(event)">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>
                <button class="primary" onclick="checkGuess()">Guess</button>
                <button onclick="skipSong()">Überspringen</button>
            </div>

            <div id="result-overlay">
                <div id="result-title">KORREKT! +100 PUNKTE</div>
                <div id="result-song-info">Songtitel - Künstler</div>
                <audio id="audio-player" controls autoplay></audio>
                <br><br>
                <button class="primary" onclick="nextRound()">Nächster Song</button>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="panel">
                <h3>🔊 Lautstärke</h3>
                <div style="display: flex; align-items: center; gap: 15px; margin-top: 15px;">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
                    <span id="volume-display" style="color: var(--green); font-weight: bold; width: 40px;">80%</span>
                </div>
            </div>

            <div class="panel">
                <h3>🔗 Spotify Link Import</h3>
                <p style="font-size: 0.85em; color: var(--text-muted); margin-top: 0;">Füge einen öffentlichen Link zu einer Spotify Playlist ein.</p>
                <input type="text" class="playlist-input" placeholder="https://open.spotify.com/playlist/...">
                <button class="primary" style="width: 100%" onclick="loadSpotifyPlaylist()">⚡ Playlist laden & starten</button>
            </div>
        </div>
    </div>

    <script>
        // Fallback-Datenbank
        let mockPlaylist = [
            { artist: "Queen", title: "Bohemian Rhapsody", lyrics: "Is this the real life Is this just fantasy", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" },
            { artist: "Rick Astley", title: "Never Gonna Give You Up", lyrics: "We're no strangers to love You know the rules", previewUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3" }
        ];

        let currentSongIndex = 0;
        let currentWordsArray = [];
        let score = 0;
        let round = 1;
        
        const revealSteps = [1, 3, 5, 10, 15, 25];
        let currentStepIndex = 0;

        // Volume Control Setup
        const volumeSlider = document.getElementById('volume-slider');
        const volumeDisplay = document.getElementById('volume-display');
        const audioPlayer = document.getElementById('audio-player');

        volumeSlider.addEventListener('input', function() {
            const volume = this.value;
            audioPlayer.volume = volume;
            volumeDisplay.innerText = Math.round(volume * 100) + '%';
        });

        async function loadSpotifyPlaylist() {
            const playlistInput = document.querySelector('.playlist-input').value;
            const loader = document.getElementById('loading-overlay');
            const loadingText = loader.querySelector('h2');
            
            if (!playlistInput.includes('spotify.com/playlist/')) {
                alert("Bitte einen gültigen Spotify Playlist Link einfügen!");
                return;
            }

            loader.style.display = 'flex';
            loadingText.innerText = "Frage Daten vom Server ab...";

            try {
                const response = await fetch('http://localhost:3000/api/get-playlist', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ playlistUrl: playlistInput })
                });

                const data = await response.json();

                if (data.playlist && data.playlist.length > 0) {
                    mockPlaylist = data.playlist; 
                    currentSongIndex = 0;
                    score = 0;
                    round = 1;
                    loader.style.display = 'none';
                    loadSong();
                } else {
                    alert("Fehler: Konnte keine Songs mit Texten in dieser Playlist finden.");
                    loader.style.display = 'none';
                }

            } catch (error) {
                console.error("Backend Fehler:", error);
                alert("Fehler bei der Verbindung zum Backend. Läuft der Server auf Port 3000?");
                loader.style.display = 'none';
            }
        }

        function loadSong() {
            if (currentSongIndex >= mockPlaylist.length) {
                document.getElementById('lyrics-text').innerText = "Spiel beendet! Alle Songs gespielt.";
                document.getElementById('guessing-controls').style.display = 'none';
                document.querySelector('.unlock-controls').style.display = 'none';
                return;
            }

            const song = mockPlaylist[currentSongIndex];
            currentWordsArray = song.lyrics.split(' ');
            currentStepIndex = 0;
            
            updateLyricsDisplay();
            updateRevealButton();
            
            document.getElementById('guess-input').value = '';
            document.getElementById('autocomplete-list').innerHTML = '';
            document.getElementById('result-overlay').style.display = 'none';
            document.getElementById('guessing-controls').style.display = 'flex';
            document.querySelector('.unlock-controls').style.display = 'flex';
            document.getElementById('round-display').innerText = `${round}/${mockPlaylist.length}`;
            document.getElementById('score-display').innerText = score;
        }

        function updateLyricsDisplay() {
            const visibleWordsCount = revealSteps[currentStepIndex];
            const visibleText = currentWordsArray.slice(0, visibleWordsCount).join(' ');
            document.getElementById('lyrics-text').innerText = `"${visibleText}..."`;
        }

        function updateRevealButton() {
            const btn = document.getElementById('reveal-btn');
            if (currentStepIndex < revealSteps.length - 1 && revealSteps[currentStepIndex] < currentWordsArray.length) {
                btn.disabled = false;
                btn.innerText = `Mehr Wörter anzeigen (${revealSteps[currentStepIndex + 1]})`;
            } else {
                btn.disabled = true;
                btn.innerText = "Alle verfügbaren Wörter gezeigt";
            }
        }

        function revealNextStep() {
            if (currentStepIndex < revealSteps.length - 1) {
                currentStepIndex++;
                updateLyricsDisplay();
                updateRevealButton();
            }
        }

        function showSuggestions(val) {
            const listContainer = document.getElementById("autocomplete-list");
            listContainer.innerHTML = '';
            if (!val) return false;

            const searchStr = val.toLowerCase();
            mockPlaylist.forEach(song => {
                if (song.title.toLowerCase().includes(searchStr) || song.artist.toLowerCase().includes(searchStr)) {
                    const item = document.createElement("div");
                    item.innerHTML = `<strong>${song.title}</strong> - ${song.artist}`;
                    item.addEventListener("click", function() {
                        document.getElementById("guess-input").value = song.title;
                        listContainer.innerHTML = '';
                    });
                    listContainer.appendChild(item);
                }
            });
        }

        document.addEventListener("click", function (e) {
            if (e.target.id !== "guess-input") document.getElementById("autocomplete-list").innerHTML = '';
        });

        function checkGuess() {
            const guessInput = document.getElementById('guess-input');
            const guess = guessInput.value.toLowerCase().trim();
            const song = mockPlaylist[currentSongIndex];
            
            if (guess === song.title.toLowerCase() || guess === song.artist.toLowerCase()) {
                triggerConfetti();
                showResult(true);
            } else {
                guessInput.classList.remove('input-error');
                void guessInput.offsetWidth; 
                guessInput.classList.add('input-error');
                setTimeout(() => guessInput.classList.remove('input-error'), 400);
            }
        }

        function skipSong() { showResult(false); }

        function showResult(isCorrect) {
            const song = mockPlaylist[currentSongIndex];
            const resultOverlay = document.getElementById('result-overlay');
            const resultTitle = document.getElementById('result-title');
            const songInfo = document.getElementById('result-song-info');

            document.getElementById('guessing-controls').style.display = 'none';
            document.querySelector('.unlock-controls').style.display = 'none';
            
            if (isCorrect) {
                resultTitle.innerText = "KORREKT! +100 PUNKTE";
                resultTitle.style.color = "var(--green)";
                resultOverlay.style.borderColor = "var(--green)";
                score += 100;
                document.getElementById('score-display').innerText = score;
            } else {
                resultTitle.innerText = "ÜBERSPRUNGEN";
                resultTitle.style.color = "var(--text-muted)";
                resultOverlay.style.borderColor = "var(--border-color)";
            }

            songInfo.innerText = `${song.title} - ${song.artist}`;
            audioPlayer.src = song.previewUrl;
            audioPlayer.volume = volumeSlider.value; // Wichtig: Beim neuen Song direkt die gewählte Lautstärke setzen
            resultOverlay.style.display = 'block';
        }

        function nextRound() {
            currentSongIndex++;
            round++;
            audioPlayer.pause();
            loadSong();
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                document.getElementById("autocomplete-list").innerHTML = '';
                checkGuess();
            }
        }

        function triggerConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#1db954', '#ffffff'] });
        }

        // Set initial volume for the player
        audioPlayer.volume = volumeSlider.value;
        loadSong();
    </script>
</body>
</html>
